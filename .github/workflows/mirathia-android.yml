name: MIRATHIA Android APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'MIRATHIA-ANDROID/**'
      - '.github/workflows/mirathia-android.yml'
  push:
    branches: [main, feature/mirathia-android-codex]
    paths:
      - 'MIRATHIA-ANDROID/**'
      - '.github/workflows/mirathia-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MIRATHIA-ANDROID
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirathia-debug-apk
          path: MIRATHIA-ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
